  <text x="100" y="246" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="21">Building responsive applications, exploring AI integrations,</text>
  <text x="100" y="278" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="21">and solving real-world problems one commit at a time.</text>

